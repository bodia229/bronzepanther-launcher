import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id 'net.neoforged.moddev' version '2.0.148'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

group = "com.brandon3055.draconicevolution"
base {
    archivesName = 'Draconic-Evolution'
}

sourceSets.main.resources.srcDirs += "src/main/generated"

mod_version = "${mod_version}." + (System.getenv("BUILD_NUMBER") ?: "9999")
version = "${mc_version}-${mod_version}"
println "Starting build of ${base.archivesName.get()}, Version: ${mod_version}"
println "Using Neoforge: ${neo_version}, for Minecraft: ${mc_version}"

neoForge {
    version = neo_version
    accessTransformers {
        publish file('src/main/resources/META-INF/accesstransformer.cfg')
        from file('../CodeChickenLib-modern/src/main/resources/META-INF/accesstransformer.cfg')
        from file('../BrandonsCore/src/main/resources/META-INF/accesstransformer.cfg')
    }
    interfaceInjectionData { from file('../CodeChickenLib-modern/src/main/resources/META-INF/interfaces.json') }
    runs {
        client {
            client()
            if (providers.gradleProperty('bpIntegration').isPresent()) jvmArguments.add('-Dbp.integration=true')
            gameDirectory = file(providers.gradleProperty('bpFullPack').isPresent() ? '../tests/fullpack-client-run' : '../tests/full-client-run')
            jvmArguments.addAll '-Xms256m', '-Xmx1024m'
            if (providers.gradleProperty('bpFullPack').isPresent()) jvmArguments.addAll '-Xmx2048m','-Dbp.fullpack=true'
            programArguments.addAll '--width', '854', '--height', '480'
        }
        guiTextures {
            clientData()
            gameDirectory = file('../tests/full-gui-data-run')
            jvmArguments.addAll '-Xms128m','-Xmx768m','-Dbp.guiTexturesOnly=true'
            programArguments.addAll '--mod','draconicevolution','--all','--output',file('../tests/generated-gui-textures').absolutePath
        }
        models {
            clientData()
            gameDirectory = file('../tests/full-model-data-run')
            jvmArguments.addAll '-Xms128m','-Xmx768m','-Dbp.modelsOnly=true'
            programArguments.addAll '--mod','draconicevolution','--all','--output',file('../tests/generated-native-models').absolutePath
        }
        server {
            server()
            if (providers.gradleProperty('bpIntegration').isPresent()) jvmArguments.add('-Dbp.integration=true')
            gameDirectory = file(providers.gradleProperty('bpFullPack').isPresent() ? '../tests/fullpack-server-run' : '../tests/full-server-run')
            jvmArguments.addAll '-Xms256m', '-Xmx1024m'
            if (providers.gradleProperty('bpFullPack').isPresent()) jvmArguments.addAll '-Xmx2048m','-Dbp.fullpack=true'
            programArguments.addAll '--nogui'
        }
    }
    mods { draconicevolution { sourceSet sourceSets.main } }
}


configurations {
}

repositories {
//    mavenLocal()
    maven { url = "https://maven.covers1624.net/" }
    maven { url = "https://chickenbones.net/maven" }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://dvs1.progwml6.com/files/maven" }
    maven { url = "https://maven.cil.li/" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { 
        url = "https://maven.squiddev.cc/"
        content { includeGroup("cc.tweaked") }
    }
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {


    implementation files('../BrandonsCore/build/libs/BrandonsCore-26.1.2-3.2.1.9999.jar')
    implementation files('../CodeChickenLib-modern/build/libs/CodeChickenLib-26.1.2-4.7.0.1.jar')
